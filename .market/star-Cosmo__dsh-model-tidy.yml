description:
  en: 'Model list control for DeepSeek Harness: hide any model from the selector or give it your own display name, with search, per-provider batch toggles and one-click restore. Display only — no provider configuration is rewritten.'
  zh: 'DSH 模型列表整理：把任意模型从选择器隐藏，或给它改一个自己的显示名，支持搜索、渠道级批量开关与一键恢复。只改显示，不重写任何渠道配置。'
